<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>अंतिम सफ़र — 3D</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="startScreen">
    <div class="startBox">
        <h1>अंतिम सफ़र</h1>
        <p>THE LAST JOURNEY</p>

        <div class="line"></div>

        <h2>एक 3D भारतीय हॉरर अनुभव</h2>

        <input
            id="playerName"
            type="text"
            maxlength="20"
            placeholder="अपना नाम लिखें"
        >

        <button id="startButton">
            🚂 सफ़र शुरू करें
        </button>

        <div id="error"></div>

        <small>
            मोबाइल: स्क्रीन पर दिए controls इस्तेमाल करें<br>
            PC: W A S D से चलें
        </small>
    </div>
</div>


<div id="gameUI" class="hidden">

    <div id="topBar">
        <span id="nameDisplay">यात्री</span>

        <span>
            ❤️ <b id="health">100</b>
            &nbsp;&nbsp;
            😨 <b id="fear">0</b>
            &nbsp;&nbsp;
            🔦 <b id="battery">100</b>
        </span>
    </div>


    <div id="crosshair">+</div>


    <div id="message">
        ट्रेन में आपका स्वागत है...
    </div>


    <div id="mobileControls">

        <div class="movePad">
            <button id="forward">▲</button>

            <div>
                <button id="left">◀</button>
                <button id="backward">▼</button>
                <button id="right">▶</button>
            </div>
        </div>

        <button id="interact">
            E
        </button>

        <button id="flashlight">
            🔦
        </button>

    </div>

</div>


<script type="module" src="script.js"></script>

</body>
</html>
